<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>링크 단축 서비스</title>
    <link type="text/css" rel="stylesheet" href="style.css" />
    <meta name="description" content="링크 단축 서비스입니다." />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/StephanWagner/jBox@v1.3.3/dist/jBox.all.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/gh/StephanWagner/jBox@v1.3.3/dist/jBox.all.min.css"
      rel="stylesheet"
    />
    <script src="script.js" type="module"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h2>
          <a href="#"
            ><i class="ion-plane"></i>링크 단축 서비스에 오신걸 환영합니다.</a
          >
        </h2>
        <nav>
          <ul>
            <li>
              <span>안녕하세요</span>
            </li>
            <li>
              <!-- 문제 1: 여러분의 이메일 주소로 변경하세요 -->
              <a class="btn" href="mailto:____@gmail.com" title="contact"
                >Contact</a
              >
            </li>
          </ul>
        </nav>
      </header>

      <div class="cover">
        <h1><strong> 줄이고 싶은 링크를 입력하세요. </strong> <br /></h1>

        <form class="flex-form" id="linkForm">
          <label for="from">
            <i class="ion-location"></i>
          </label>
          <input
            type="search"
            placeholder="ex) https://example.com"
            id="link"
          />
          <input type="button" value="생성" id="make" />
        </form>
        <div id="madeby">
          <span>
            Photo by
            <a href="https://unsplash.com/ko/@photochet" target="_blank"
              >Chetan Rana</a
            >
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
