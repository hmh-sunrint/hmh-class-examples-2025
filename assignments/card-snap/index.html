<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO: 타이틀을 자신의 이름으로 변경하세요 (예: '홍길동님의 카드스냅') -->
  <title>[당신의 이름]님의 카드스냅</title>
  <link rel="stylesheet" href="./style.css">
  <!-- SweetAlert2 라이브러리 (QR코드 팝업용) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body id="fullscreen">
  <!-- 전체화면 전 안내 메시지 -->
  <div id="clickbait">클릭하여 명함을 보세요.</div>

  <!-- 메인 카드 컨테이너 -->
  <div class="card">
    <div class="flip">
      <!-- 카드 앞면 -->
      <div class="front horizontal">
        <div class="card-content-left">
          <!-- TODO: 프로필 이미지를 추가하세요 (예: /placeholder.svg?height=100&width=100) -->
          <img src="/placeholder.svg?height=100&width=100" alt="profile" style="width:37%;">
          <br><br>
          <!-- TODO: 자신의 이름을 입력하세요 (예: '홍길동') -->
          <h2>[당신의 이름]</h2>
          <!-- TODO: 자신의 직업/역할을 입력하세요 (예: '프론트엔드 개발자') -->
          <p>[직업/역할] 🔧</p>
        </div>
        
        <div class="card-content">
          <p>|</p>
        </div>
        
        <div class="card-content-right">
          <p>Career : </p>
          <br>
          <!-- TODO: 자신의 경력/기술스택을 4개 입력하세요 (예: '데이터베이스', '모바일웹', '백엔드', '프론트엔드') -->
          <p class="rounded_p">💾 | 커리어1</p>
          <br>
          <p class="rounded_p">📱 | 커리어2</p>
          <br>
          <p class="rounded_p">🖥️ | 커리어3</p>
          <br>
          <p class="rounded_p">🖥️ | 커리어4</p>
        </div>
      </div>
      
      <!-- 카드 뒷면 -->
      <div class="back horizontal">
        <div class="card-content-left">
          <h2>Contact me : </h2>
          <br>
          <!-- TODO: 소셜미디어 링크들을 자신의 것으로 변경하세요 (예: 'https://youtube.com/yourchannel') -->
          <!-- 유튜브 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" height="2em" viewBox="0 0 576 512">
            <path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/>
          </svg>
          <a href="https://youtube.com/yourchannel" style="color: aliceblue;">유튜브채널</a>
          <br><br>
          
          <!-- 인스타그램 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" height="2em" viewBox="0 0 448 512">
            <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
          </svg>
          <a href="https://instagram.com/youraccount" style="color: aliceblue;">인스타그램</a>
          <br><br>
          
          <!-- 페이스북 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" height="2em" viewBox="0 0 512 512">
            <path d="M504 256C504 119 393 8 256 8S8 119 8 256c0 123.78 90.69 226.38 209.25 245V327.69h-63V256h63v-54.64c0-62.15 37-96.48 93.67-96.48 27.14 0 55.52 4.84 55.52 4.84v61h-31.28c-30.8 0-40.41 19.12-40.41 38.73V256h68.78l-11 71.69h-57.78V501C413.31 482.38 504 379.78 504 256z"/>
          </svg>
          <a href="https://facebook.com/yourpage" style="color: aliceblue;">페이스북</a>
        </div>
        
        <div class="card-content">
          <p>|</p>
        </div>
        
        <div class="card-content-right">
          <h2>찾아오시는 길</h2>
          <br>
          <!-- TODO: 구글맵 임베드 코드를 자신의 위치로 변경하세요.
               구글맵에서 원하는 위치 검색 -> '공유' 버튼 클릭 -> '지도 퍼가기' 탭 선택 -> 'HTML 복사' 버튼 클릭 후 여기에 붙여넣으세요.
               예시: <iframe src="https://www.google.com/maps/embed?..." width="200" height="150" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          -->
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8943.895555284784!2d126.97002535119121!3d37.57521260525938!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca2c74aeddea1%3A0x8b3046532cc715f6!2sGyeongbokgung%20Palace!5e0!3m2!1sen!2skr!4v1690461988491!5m2!1sen!2skr" width="200" height="150" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- QR코드 공유 버튼 -->
  <div class="sharebtn">
    <button class="share-btn">
      <svg xmlns="http://www.w3.org/2000/svg" id="svgbox" height="2em" viewBox="0 0 512 512">

      </svg>
    </button>
  </div>

  <!-- JavaScript 파일 연결 -->
  <script src="./script.js"></script>
</body>
</html>
