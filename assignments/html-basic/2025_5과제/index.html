<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>목록과 표 연습</title>
</head>
<body>
    <h2>할 일 목록 (ul)</h2>
    <ul>
        <li><!-- 할 일 1 --></li>
        <li><!-- 할 일 2 --></li>
    </ul>
    <h2>순서 있는 목록 (ol)</h2>
    <ol>
        <li><!-- 단계 1 --></li>
        <li><!-- 단계 2 --></li>
    </ol>
    <h2>간단한 표</h2>
    <table border="1">
        <tr>
            <th><!-- 열 제목 1 --></th>
            <th><!-- 열 제목 2 --></th>
        </tr>
        <tr>
            <td><!-- 데이터 1 --></td>
            <td><!-- 데이터 2 --></td>
        </tr>
    </table>
</body>
</html>
