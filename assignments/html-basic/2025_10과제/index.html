<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10과제: 블로그 게시물 및 댓글</title>
    <style>
        /* 기본적인 스타일링을 위한 내부 CSS */
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .blog-post-container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #eee; }
        .post-meta { font-size: 0.9em; color: #666; margin-bottom: 20px; }
        .post-image { max-width: 100%; height: auto; display: block; margin: 20px 0; }
        .content-list { list-style-type: decimal; margin-left: 20px; }
        .related-posts a { margin-right: 10px; text-decoration: none; color: #007bff; }
        .comments-section { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
        .comment-form { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; background-color: #f9f9f9; }
        .comment-form label { display: block; margin-bottom: 5px; font-weight: bold; }
        .comment-form input[type="text"],
        .comment-form textarea {
            width: calc(100% - 16px); padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;
        }
        .comment-form button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .comment-form button:hover { background-color: #0056b3; }
        .comment-list { list-style: none; padding: 0; }
        .comment-list li { border-bottom: 1px dashed #eee; padding: 10px 0; }
        .comment-author { font-weight: bold; color: #333; }
        .comment-date { font-size: 0.8em; color: #999; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="blog-post-container">
        <!-- 문제: 블로그 게시물의 제목을 가장 중요한 제목으로 표시하세요. (예: 제주도 숨겨진 명소 탐방기) -->
        <h1></h1>
        
        <!-- 문제: 작성자와 작성일을 나타내는 단락을 추가하세요. -->
        <p class="post-meta">작성자: <!-- 작성자 이름 --> | 작성일: <!-- 작성일 --></p>
        
        <!-- 문제: 게시물 서론을 단락으로 작성하세요. -->
        <p>
            <!-- 여기에 게시물 서론 내용을 작성하세요. -->
        </p>
        
        <!-- 문제: 게시물 내용을 대표하는 이미지를 추가하고, 적절한 alt 텍스트를 넣어주세요. -->
        <!-- 힌트: <img src="/placeholder.svg?height=300&width=700" alt="이미지 설명"> -->
        <img src="/placeholder.svg" alt="" class="post-image">
        
        <!-- 문제: 게시물의 소제목과 내용을 각각 h2와 p 태그로 작성하세요. 최소 2개 이상. -->
        <h2></h2>
        <p>
            <!-- 소제목에 대한 내용 -->
        </p>
        
        <h2></h2>
        <p>
            <!-- 소제목에 대한 내용 -->
        </p>

        <h3>여행 팁</h3>
        <ul class="content-list">
            <!-- 문제: 게시물과 관련된 팁을 순서 있는 목록으로 3가지 이상 작성하세요. -->
            <li><!-- 팁 1 --></li>
            <li><!-- 팁 2 --></li>
            <li><!-- 팁 3 --></li>
        </ul>

        <div class="related-posts">
            <h2>관련 게시물</h2>
            <p>
                <!-- 문제: 관련 게시물 링크 2개 이상을 추가하세요. (링크는 #으로 대체 가능) -->
                <a href="#"></a>
                <a href="#"></a>
            </p>
        </div>

        <!-- 댓글 섹션 -->
        <div class="comments-section">
            <h2>댓글</h2>
            
            <!-- 문제: 댓글 작성 폼을 만드세요. -->
            <!-- 힌트: 이름 입력 필드와 댓글 내용 입력 영역, 그리고 댓글 작성 버튼을 포함하세요. -->
            <form class="comment-form">
                <label for="comment-author">이름:</label>
                <input type="text" id="comment-author" name="author" required>
                
                <label for="comment-text">댓글 내용:</label>
                <textarea id="comment-text" name="comment" rows="5" required></textarea>
                
                <button type="submit">댓글 작성</button>
            </form>
            
            <!-- 기존 댓글 목록 -->
            <ul class="comment-list">
                <!-- 문제: 기존 댓글 2개 이상을 목록으로 추가하세요. -->
                <!-- 힌트: li 태그 안에 span (작성자, 날짜)와 p (댓글 내용)를 사용하세요. -->
                <li>
                    <span class="comment-author"><!-- 작성자 이름 --></span>
                    <span class="comment-date"><!-- 작성일 --></span>
                    <p><!-- 댓글 내용 --></p>
                </li>
                <li>
                    <span class="comment-author"><!-- 작성자 이름 --></span>
                    <span class="comment-date"><!-- 작성일 --></span>
                    <p><!-- 댓글 내용 --></p>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
