<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9과제: 이벤트 등록 및 일정표</title>
    <style>
        /* 기본적인 스타일링을 위한 내부 CSS */
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .event-container { max-width: 900px; margin: auto; padding: 20px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .registration-form { margin-top: 30px; padding: 20px; border: 1px solid #ccc; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="number"],
        .form-group textarea {
            width: calc(100% - 16px); padding: 8px; border: 1px solid #ddd; border-radius: 4px;
        }
        .form-group input[type="radio"],
        .form-group input[type="checkbox"] { margin-right: 5px; }
        .form-group button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .form-group button:hover { background-color: #218838; }
        .links a { margin-right: 10px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="event-container">
        <!-- 문제: 이벤트의 제목을 가장 중요한 제목으로 표시하세요. (예: 2025 웹 개발 컨퍼런스) -->
        <h1></h1>
        <p>
            <!-- 문제: 이벤트에 대한 간략한 소개를 단락으로 작성하세요. -->
        </p>

        <h2>이벤트 일정</h2>
        <!-- 문제: 이벤트 일정을 나타내는 표를 만드세요. -->
        <!-- 힌트: thead, tbody, tr, th, td 태그를 사용하세요. -->
        <table>
            <thead>
                <tr>
                    <!-- 문제: 표의 헤더(예: 시간, 세션명, 발표자, 장소)를 작성하세요. -->
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- 문제: 최소 2개 이상의 이벤트 세션 정보를 행으로 추가하세요. -->
                    <td><!-- 시간 --></td>
                    <td><!-- 세션명 --></td>
                    <td><!-- 발표자 --></td>
                    <td><!-- 장소 --></td>
                </tr>
                <tr>
                    <td><!-- 시간 --></td>
                    <td><!-- 세션명 --></td>
                    <td><!-- 발표자 --></td>
                    <td><!-- 장소 --></td>
                </tr>
            </tbody>
        </table>

        <h2>참가 등록</h2>
        <!-- 문제: 참가 등록 폼을 만드세요. -->
        <!-- 힌트: form 태그 안에 div.form-group으로 각 입력 필드를 묶으세요. -->
        <form class="registration-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <!-- 힌트: input type="text"를 사용하고, id, name, required 속성을 설정하세요. -->
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <!-- 힌트: input type="email"을 사용하고, id, name, required 속성을 설정하세요. -->
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>참가 유형:</label>
                <!-- 문제: 라디오 버튼으로 '학생', '개발자', '기타' 중 하나를 선택하게 하세요. -->
                <!-- 힌트: input type="radio"와 label을 사용하고, name 속성을 동일하게 설정하세요. -->
                <input type="radio" id="student" name="type" value="student">
                <label for="student">학생</label>
                <input type="radio" id="developer" name="type" value="developer">
                <label for="developer">개발자</label>
            </div>
            <div class="form-group">
                <label>관심 분야 (복수 선택 가능):</label>
                <!-- 문제: 체크박스로 '프론트엔드', '백엔드', '데브옵스' 중 복수 선택하게 하세요. -->
                <!-- 힌트: input type="checkbox"와 label을 사용하고, name 속성을 동일하게 설정하세요. -->
                <input type="checkbox" id="frontend" name="interest" value="frontend">
                <label for="frontend">프론트엔드</label>
                <input type="checkbox" id="backend" name="interest" value="backend">
                <label for="backend">백엔드</label>
            </div>
            <div class="form-group">
                <label for="message">하고 싶은 말:</label>
                <!-- 힌트: textarea를 사용하고, id, name, rows 속성을 설정하세요. -->
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <div class="form-group">
                <!-- 힌트: button type="submit"을 사용하세요. -->
                <button type="submit">등록하기</button>
            </div>
        </form>

        <div class="links">
            <h2>관련 정보</h2>
            <p>
                <!-- 문제: 이벤트 관련 외부 링크 2개 이상을 추가하세요. (target="_blank" 속성 사용) -->
                <a href="#" target="_blank"><!-- 링크 텍스트 1 --></a>
                <a href="#" target="_blank"><!-- 링크 텍스트 2 --></a>
            </p>
        </div>
    </div>
</body>
</html>
