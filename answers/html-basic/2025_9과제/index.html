<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <!-- 문서의 문자 인코딩을 UTF-8로 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 반응형 웹을 위한 뷰포트 설정 -->
    <title>9과제: 이벤트 등록 및 일정표</title> <!-- 웹 페이지의 제목 설정 -->
    <style>
        /* 기본적인 스타일링을 위한 내부 CSS */
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            line-height: 1.6; 
        }
        .event-container { 
            max-width: 900px; 
            margin: auto; 
            padding: 20px; 
            border: 1px solid #eee; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; /* 테이블 셀 경계선 병합 */
            margin-top: 20px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 
        }
        th { 
            background-color: #f2f2f2; /* 테이블 헤더 배경색 */
        }
        .registration-form { 
            margin-top: 30px; 
            padding: 20px; 
            border: 1px solid #ccc; 
            background-color: #f9f9f9; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        .form-group label { 
            display: block; /* 라벨을 블록 요소로 설정 */
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="number"],
        .form-group textarea {
            width: calc(100% - 16px); /* 너비 계산 (패딩 고려) */
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; /* 모서리 둥글게 */
        }
        .form-group input[type="radio"],
        .form-group input[type="checkbox"] { 
            margin-right: 5px; 
        }
        .form-group button { 
            padding: 10px 20px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; /* 마우스 오버 시 커서 변경 */
        }
        .form-group button:hover { 
            background-color: #218838; /* 호버 시 배경색 변경 */
        }
        .links a { 
            margin-right: 10px; 
            text-decoration: none; 
            color: #007bff; 
        }
    </style>
</head>
<body>
    <div class="event-container">
        <!-- 이벤트의 제목을 가장 중요한 제목으로 표시 -->
        <h1>2025 웹 개발 컨퍼런스</h1>
        <p>
            <!-- 이벤트에 대한 간략한 소개를 단락으로 작성 -->
            최신 웹 기술 트렌드와 실전 노하우를 공유하는 2025 웹 개발 컨퍼런스에 여러분을 초대합니다. 
            다양한 세션과 네트워킹 기회를 놓치지 마세요!
        </p>

        <h2>이벤트 일정</h2>
        <!-- 이벤트 일정을 나타내는 표를 만듦 -->
        <table>
            <thead>
                <tr>
                    <!-- 표의 헤더를 작성 -->
                    <th>시간</th>
                    <th>세션명</th>
                    <th>발표자</th>
                    <th>장소</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- 최소 2개 이상의 이벤트 세션 정보를 행으로 추가 -->
                    <td>09:00 - 10:00</td>
                    <td>키노트: 웹의 미래</td>
                    <td>김철수</td>
                    <td>메인 홀</td>
                </tr>
                <tr>
                    <td>10:15 - 11:15</td>
                    <td>React 심화 가이드</td>
                    <td>이영희</td>
                    <td>트랙 A</td>
                </tr>
                <tr>
                    <td>11:30 - 12:30</td>
                    <td>Next.js 실전 활용</td>
                    <td>박지성</td>
                    <td>트랙 B</td>
                </tr>
                <tr>
                    <td>12:30 - 13:30</td>
                    <td>점심 식사</td>
                    <td>-</td>
                    <td>식당</td>
                </tr>
            </tbody>
        </table>

        <h2>참가 등록</h2>
        <!-- 참가 등록 폼을 만듦 -->
        <form class="registration-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>참가 유형:</label>
                <!-- 라디오 버튼으로 '학생', '개발자', '기타' 중 하나를 선택하게 함 -->
                <input type="radio" id="student" name="type" value="student">
                <label for="student">학생</label>
                <input type="radio" id="developer" name="type" value="developer" checked>
                <label for="developer">개발자</label>
                <input type="radio" id="other" name="type" value="other">
                <label for="other">기타</label>
            </div>
            <div class="form-group">
                <label>관심 분야 (복수 선택 가능):</label>
                <!-- 체크박스로 '프론트엔드', '백엔드', '데브옵스' 중 복수 선택하게 함 -->
                <input type="checkbox" id="frontend" name="interest" value="frontend">
                <label for="frontend">프론트엔드</label>
                <input type="checkbox" id="backend" name="interest" value="backend">
                <label for="backend">백엔드</label>
                <input type="checkbox" id="devops" name="interest" value="devops">
                <label for="devops">데브옵스</label>
            </div>
            <div class="form-group">
                <label for="message">하고 싶은 말:</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <div class="form-group">
                <button type="submit">등록하기</button>
            </div>
        </form>

        <div class="links">
            <h2>관련 정보</h2>
            <p>
                <!-- 이벤트 관련 외부 링크 2개 이상을 추가 -->
                <a href="https://example.com/speakers" target="_blank">연사 소개</a>
                <a href="https://example.com/location" target="_blank">오시는 길</a>
            </p>
        </div>
    </div>
</body>
</html>
