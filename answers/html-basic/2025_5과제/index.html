<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>목록과 표</title>
</head>
<body>
    <h2>할 일 목록</h2>
    <ul>
        <li>웹사이트 만들기</li>
        <li>디자인 공부하기</li>
    </ul>
    <h2>순서 있는 목록</h2>
    <ol>
        <li>HTML 구조 만들기</li>
        <li>스타일 적용하기</li>
    </ol>
    <h2>간단한 표</h2>
    <table border="1">
        <tr>
            <th>이름</th>
            <th>연령</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>25</td>
        </tr>
    </table>
</body>
</html>
