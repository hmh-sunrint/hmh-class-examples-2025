<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="학생 키오스크 주문 시스템" />
    <meta name="author" content="학생" />
    <!-- basicModal 라이브러리 (로컬 간단 모달) -->
    <link rel="stylesheet" href="dist/basicModal.min.css" />
    <script src="dist/basicModal.min.js"></script>
    <title>학생 키오스크</title>
    <!-- Bootstrap core CSS -->
    <link href="bootstrap.min.css" rel="stylesheet" />
    <!-- Custom styles for this template -->
    <link href="pricing.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <div
      class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow"
    >
      <!-- 과제 1: 타이틀 바꾸기 - 개인정보가 아닌 수업용 별칭으로 변경 -->
      <h5 class="my-0 mr-md-auto font-weight-normal">
        HMH 예시 상점
      </h5>
      <nav class="my-2 my-md-0 mr-md-3">
        <!-- <a class="btn btn-outline-warning" href="#">계산핑 호출</a> -->
      </nav>
      <a class="btn btn-outline-primary" href="javascript:void(0)" id="checkoutButton">결제 하기</a>
    </div>

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
      <strong>
        <h1 class="display-4">MENU</h1>
        <p></p
      ></strong>
      <!-- 과제 2: 본문 내용 바꾸기 - 키오스크에 어울리는 문구로 변경 -->
      <p class="lead">
        <strong>신선하고 맛있는 음식들을 준비했습니다! 마음껏 골라보세요!</strong>
      </p>
    </div>

    <div class="container">
      <div class="card-deck mb-3 text-center" id="product-cards-container">
        <!-- 상품 카드들은 JavaScript에서 동적으로 생성됩니다. -->
      </div><br>
      <button
        type="button"
        class="btn btn-lg btn-block btn-outline-primary"
        id="total_price_button"
      >
        ₩ 0 | 계산하기
      </button><br><br>
      <p>
        <button
        type="button"
        class="btn btn-lg btn-block btn-outline-primary"
        id="resetOrderButton"
      >
        주문 초기화
      </button>
      </p>
      <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <div class="row">
          <div class="col-12 col-md">
            <br />
            <!-- 과제 3: 푸터 내용 바꾸기 - 수업용 별칭으로 변경 -->
            <p id="copyright">
                <small class="d-block mb-3 text-muted">&copy; HMH 예시 | 2025</small>
              </p>
          </div>
        </div>
      </footer>
    </div>

    <!-- 메인 JavaScript 파일 -->
    <script src="script.js"></script>
  </body>
</html>
