<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 QR 코드 생성기 (정답)</title>
    <!-- Bootstrap CSS CDN을 불러와서 예쁜 디자인을 쉽게 만들 수 있어! -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- 우리가 직접 만든 스타일 시트도 불러오자! -->
    <link rel="stylesheet" href="style.css">
    <!-- QR 코드 생성 라이브러리(qrcode.js)의 CDN 링크를 넣어줘야 해! -->
    <!-- 이 라이브러리가 'QRCode'라는 전역 변수를 만들어줘서, script.js에서 바로 쓸 수 있어! -->
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
</head>
<body>
    <!-- 이제 card를 body의 바로 아래 자식으로 만들어서 중앙 정렬이 더 잘 되게 할 거야! -->
    <div class="card shadow-lg p-4">
        <h1 class="card-title text-center mb-4">✨ 나만의 QR 코드 생성기 ✨</h1>
        <p class="text-center text-muted">URL이나 텍스트를 입력하고, 원하는 색상으로 멋진 QR 코드를 만들어봐!</p>

        <div class="mb-3">
            <label for="qrContent" class="form-label">QR 코드 내용 (URL 또는 텍스트)</label>
            <input type="text" class="form-control" id="qrContent" placeholder="예: https://www.vercel.com 또는 안녕하세요!">
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="qrColorDark" class="form-label">QR 코드 색상</label>
                <input type="color" class="form-control form-control-color" id="qrColorDark" value="#000000" title="QR 코드 색상">
            </div>
            <div class="col-md-6">
                <label for="qrColorLight" class="form-label">배경 색상</label>
                <input type="color" class="form-control form-control-color" id="qrColorLight" value="#ffffff" title="배경 색상">
            </div>
        </div>

        <button id="generateBtn" class="btn btn-primary w-100 mb-4">QR 코드 생성하기!</button>

        <div class="text-center">
            <div id="qrcode" class="d-inline-block p-3 border rounded shadow-sm">
                <!-- 여기에 QR 코드가 나타날 거야! -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript CDN을 불러와서 Bootstrap 기능들을 사용할 수 있게 해줘! -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- 우리가 직접 만든 자바스크립트 파일도 불러오자! -->
    <script src="script.js"></script>
</body>
</html>
